# Local-only Supplier Quote Extractor.
# No environment file and no volumes. API keys are pasted into
# the UI and are never provided to the container.

name: supplier-quote-extractor

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: supplier-quote-extractor:local
    user: "10001:10001"
    ports:
      - "8501:8501"
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=512m
      - /home/appuser:uid=10001,gid=10001,mode=700,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/appuser
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
