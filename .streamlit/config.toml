# Server settings for the local container. No secrets file is read.
# Open the app at http://localhost:8501. Add another hostname to allowedHosts
# if the browser uses a different host.

[global]
developmentMode = false

[server]
headless = true
address = "0.0.0.0"
port = 8501
# true keeps Streamlit's cross-origin checks on. false would send
# Access-Control-Allow-Origin: * on most routes.
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false
maxUploadSize = 20
fileWatcherType = "none"
corsAllowedOrigins = []
allowedHosts = ["localhost", "127.0.0.1"]

[browser]
gatherUsageStats = false

[logger]
level = "info"
enableRich = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F3A4D"
backgroundColor = "#F7F6F3"
secondaryBackgroundColor = "#EEF2F4"
textColor = "#1F2933"
borderColor = "#E4E0D8"
showSidebarBorder = true
font = "sans serif"
# Quoted strings. An unquoted number is ignored by Streamlit.
paddingTop = "1.4rem"
paddingBottom = "2rem"
